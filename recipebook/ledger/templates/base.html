<!DOCTYPE html>
<html lang="en">
<head>
  <title>{%block title%}Recipe Book{%endblock%}</title>
</head>
<body>
  <header>
    <nav>
      <div>
        <ul class="navbar-nav">
          <li class="nav-item">
            {% if user.is_authenticated %}
              <form action="{% url 'logout' %}?next={% url 'login' %}" method="post">
                {% csrf_token %}
                <button class="nav-link" type="submit">Logout</button>
              </form>
            {% else %}
              <a href="{% url 'login' %}">Login</a>
            {% endif %}
          </li>
        </ul>
      </div>
    </nav>
    <h1>Recipe Book</h1>
  </header>
  <h1>{% block heading %}{%endblock%}</h1>
  <div id='content'>
    {% block content%}{%endblock%}
  </div>
</body>
</html>
