{% extends 'base.html'%}
{% load static%}
{%block title%}Recipe List{%endblock%}
{% block heading %}Recipe List{%endblock%}
{% block content%}
  <ul>
    {% for recipe in recipes%}
        <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
    {%endfor%}
  </ul>
  <a href="{% url 'ledger:add_recipe' %}">Add a recipe</a>
{%endblock%}
